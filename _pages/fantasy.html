---
layout: redesign_default
title: fantasy
permalink: /fantasy/
description: "My ESPN fantasy basketball team: record, fantasy points, this week's matchup and roster."
nav: false
---

<style>
  /* colors carry !important because the redesign base pins text color on div/span/p */
  .ff-muted {
    color: var(--muted) !important;
  }
  .ff-team {
    padding: 4px 0 8px;
  }
  .ff-kicker {
    font-size: 11.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent) !important;
  }
  .ff-team-name {
    font-family: var(--display);
    font-weight: 500;
    font-size: 34px;
    line-height: 1.1;
    margin: 6px 0 20px;
  }
  .ff-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;
    margin: 0;
  }
  .ff-stats > div {
    background: var(--bg);
    padding: 14px 16px 12px;
  }
  .ff-stats dt {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 400;
  }
  .ff-stats dd {
    margin: 4px 0 0;
    font-size: 26px;
    line-height: 1.1;
    color: var(--fg);
  }
  .ff-stats dd small {
    font-size: 13px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* this week */
  .ff-score {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 6px 18px;
  }
  .ff-side-name {
    display: block;
    font-size: 14px;
    color: var(--fg-2) !important;
    overflow-wrap: anywhere;
  }
  .ff-side b {
    display: block;
    font-size: 40px;
    line-height: 1.05;
    font-weight: 500;
    color: var(--fg);
  }
  .ff-side.is-me b {
    color: var(--accent);
  }
  .ff-side.is-opp {
    text-align: right;
  }
  .ff-vs {
    font-size: 13px;
    color: var(--muted) !important;
    padding-bottom: 10px;
  }
  .ff-bar {
    grid-column: 1 / -1;
    display: flex;
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    background: var(--rule);
    margin-top: 8px;
  }
  .ff-bar i {
    display: block;
    background: var(--accent);
    transition: width 0.6s ease;
  }
  .ff-note {
    grid-column: 1 / -1;
    margin: 4px 0 0;
    font-size: 13.5px;
    color: var(--meta) !important;
  }

  /* roster */
  .ff-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }
  .ff-table th {
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: right;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--rule-2);
    white-space: nowrap;
  }
  .ff-table th:nth-child(-n + 2) {
    text-align: left;
  }
  .ff-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--rule);
    vertical-align: top;
    text-align: right;
    white-space: nowrap;
    color: var(--fg);
  }
  .ff-table td.ff-slot {
    text-align: left;
    color: var(--muted);
    font-size: 13px;
    padding-top: 12px;
    width: 3.5em;
  }
  .ff-table td.ff-player {
    text-align: left;
    white-space: normal;
    width: 100%;
  }
  .ff-table th:first-child,
  .ff-table td:first-child {
    padding-left: 0;
  }
  .ff-table th:last-child,
  .ff-table td:last-child {
    padding-right: 0;
  }
  .ff-name {
    font-weight: 700;
  }
  .ff-sub {
    display: block;
    font-size: 13px;
    color: var(--meta) !important;
    margin-top: 2px;
  }
  .ff-tag {
    display: inline-block;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    padding: 1px 6px;
    margin-left: 6px;
    border-radius: 3px;
    border: 1px solid currentColor;
    vertical-align: 2px;
    color: var(--accent) !important;
  }
  .ff-tag.is-out {
    color: var(--seal) !important;
  }
  .ff-avg {
    font-weight: 700;
  }
  .ff-up {
    color: #4f7a3a !important;
  }
  .ff-down {
    color: var(--seal) !important;
  }
  .ff-group td {
    padding: 22px 0 6px;
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    text-align: left;
    border-bottom: 1px solid var(--rule-2);
  }
  .ff-table tr.is-bench td.ff-player .ff-name,
  .ff-table tr.is-ir td.ff-player .ff-name {
    font-weight: 400;
  }

  /* season log */
  .ff-log {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 10px;
  }
  .ff-log li {
    display: grid;
    grid-template-columns: 4.5em 1.6em 1fr auto;
    align-items: center;
    gap: 12px;
    font-size: 14.5px;
  }
  .ff-wk {
    color: var(--muted) !important;
  }
  .ff-res {
    font-weight: 700;
    color: var(--fg-2) !important;
  }
  .ff-res.is-w {
    color: var(--accent) !important;
  }
  .ff-bars {
    display: grid;
    gap: 3px;
  }
  .ff-bars i {
    display: block;
    height: 6px;
    border-radius: 3px;
    background: var(--rule-2);
  }
  .ff-bars i.is-me {
    background: var(--accent);
  }
  .ff-log-score {
    text-align: right;
    white-space: nowrap;
  }
  .ff-log-score small {
    display: block;
    font-size: 12px;
    color: var(--muted);
  }

  .ff-foot {
    margin-top: 28px;
    font-size: 12.5px;
    color: var(--muted) !important;
  }
  .ff-empty {
    padding: 28px 0;
    color: var(--meta) !important;
  }
  .ff-skel {
    display: grid;
    gap: 10px;
    padding: 8px 0 24px;
  }
  .ff-skel i {
    display: block;
    height: 14px;
    border-radius: 3px;
    background: var(--bg-2);
    animation: ff-pulse 1.4s ease-in-out infinite;
  }
  @keyframes ff-pulse {
    50% {
      opacity: 0.45;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .ff-skel i,
    .ff-bar i {
      animation: none;
      transition: none;
    }
  }

  @media (max-width: 700px) {
    .ff-stats {
      grid-template-columns: 1fr 1fr;
    }
    .ff-team-name {
      font-size: 28px;
    }
    .ff-side b {
      font-size: 30px;
    }
    .ff-table .ff-wide {
      display: none;
    }
    .ff-table {
      font-size: 14px;
    }
    .ff-log li {
      grid-template-columns: 3.6em 1.4em 1fr auto;
      gap: 8px;
      font-size: 13.5px;
    }
  }
</style>

<div class="page-anim ff">
  <div class="page-header">
    <div>
      <h1 class="page-title">fantasy</h1>
    </div>
    <span class="section-aside" id="ff-league">nba · espn fantasy</span>
  </div>

  <div id="ff-root" aria-live="polite" aria-busy="true">
    <div class="ff-skel" aria-hidden="true">
      <i style="width: 30%"></i>
      <i style="width: 55%; height: 30px"></i>
      <i style="width: 100%; height: 64px"></i>
      <i style="width: 80%"></i>
      <i style="width: 90%"></i>
      <i style="width: 70%"></i>
    </div>
    <p class="ff-muted">loading roster…</p>
  </div>
  <noscript><p class="ff-empty">The roster loads with JavaScript.</p></noscript>
</div>

<script defer src="{{ '/assets/js/fantasy.js' | relative_url | bust_file_cache }}"></script>
